<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GenLayer Spinner — Decentralized AI Consensus</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg-0:#05010f;--bg-1:#0a0420;--bg-2:#11062e;
    --violet:#8b5cf6;--cyan:#22d3ee;--fuchsia:#e879f9;--azure:#60a5fa;
    --ink:#e9e6ff;--ink-dim:#b8b3d9;
  }
  html,body{height:100%}
  body{
    font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(1200px 700px at 20% 10%, rgba(139,92,246,.18), transparent 60%),
      radial-gradient(1000px 600px at 80% 90%, rgba(232,121,249,.14), transparent 60%),
      radial-gradient(900px 500px at 60% 50%, rgba(34,211,238,.10), transparent 60%),
      linear-gradient(180deg,var(--bg-0) 0%,var(--bg-1) 60%,var(--bg-2) 100%);
    color:var(--ink);
    overflow:hidden;
    min-height:100vh;
    display:grid;
    place-items:center;
    perspective:1200px;
  }
  
  /* Cyberpunk Grid */
  .grid{
    position:fixed;inset:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(139,92,246,.06) 1px,transparent 1px),
      linear-gradient(90deg,rgba(34,211,238,.05) 1px,transparent 1px);
    background-size:48px 48px;
    -webkit-mask-image:radial-gradient(ellipse at center,black 30%,transparent 75%);
            mask-image:radial-gradient(ellipse at center,black 30%,transparent 75%);
    animation:gridShift 24s linear infinite;
  }
  @keyframes gridShift{to{background-position:48px 48px,48px 48px}}

  /* Micro Stars */
  .stars{
    position:fixed;inset:0;pointer-events:none;opacity:.55;animation:twinkle 6s ease-in-out infinite;
    background-image:
      radial-gradient(1px 1px at 12% 22%,#fff,transparent),
      radial-gradient(1px 1px at 78% 18%,#f0abfc,transparent),
      radial-gradient(1.5px 1.5px at 38% 72%,#67e8f9,transparent),
      radial-gradient(1px 1px at 66% 84%,#c4b5fd,transparent),
      radial-gradient(1px 1px at 22% 88%,#fff,transparent),
      radial-gradient(1px 1px at 88% 44%,#a5f3fc,transparent),
      radial-gradient(1.5px 1.5px at 50% 8%,#fff,transparent);
  }
  @keyframes twinkle{50%{opacity:.25}}

  /* Stage Card Container */
  .stage{
    position:relative;
    width:min(90vw, 500px);
    aspect-ratio:1/1;
    border-radius:28px;
    padding:24px;
    background:rgba(15, 10, 35, 0.65);
    border:1px solid rgba(139,92,246,.35);
    box-shadow:
      0 0 0 1px rgba(34,211,238,.1) inset,
      0 20px 60px rgba(10, 4, 32, 0.8),
      0 0 40px rgba(139,92,246,.2);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    transform-style:preserve-3d;
    will-change:transform;
    transition:transform 180ms ease-out;
  }

  /* HUD */
  .hud{position:absolute;font-size:10px;letter-spacing:.18em;text-transform:uppercase;opacity:.7;pointer-events:none}
  .hud.tl{top:16px;left:18px;color:var(--ink-dim)}
  .hud.tr{top:16px;right:18px;color:#67e8f9}
  .hud.bl{bottom:16px;left:18px;color:#f0abfc}
  .hud.br{bottom:16px;right:18px;color:var(--ink-dim)}

  .caption{
    position:absolute;top:16px;left:50%;transform:translateX(-50%);
    font-size:10px;letter-spacing:.45em;text-transform:uppercase;
    color:var(--ink-dim);opacity:.9;white-space:nowrap;pointer-events:none;
  }
  .caption span{color:#67e8f9}

  /* Core Spinner */
  .spinner-wrap{
    position:relative;width:100%;height:100%;
    display:grid;place-items:center;
    transform-style:preserve-3d;
  }
  svg.core{width:82%;height:82%;overflow:visible}

  .ring{fill:none;transform-origin:center;transform-box:fill-box;animation:spin linear infinite}
  .ring.r1{stroke:url(#g1);stroke-width:1.2;stroke-dasharray:4 6;animation-duration:14s;opacity:.85}
  .ring.r2{stroke:url(#g2);stroke-width:1;stroke-dasharray:2 4;animation-duration:9s;animation-direction:reverse;opacity:.6}
  .ring.r3{stroke:url(#g3);stroke-width:1.5;stroke-dasharray:28 14;animation-duration:22s;opacity:.9}
  @keyframes spin{to{transform:rotate(360deg)}}

  .core-hex{fill:none;stroke:url(#hex);stroke-width:1;animation:spin 30s linear infinite;opacity:.8;transform-origin:center;transform-box:fill-box}

  .core-node{
    fill:#fff;
    filter:drop-shadow(0 0 8px #c4b5fd) drop-shadow(0 0 16px #8b5cf6);
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.18);opacity:.85}}

  .node{fill:#fff;transform-origin:center;transform-box:fill-box;animation:nodePulse 1.8s ease-in-out infinite}
  @keyframes nodePulse{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
  .glow-violet{filter:drop-shadow(0 0 5px #a78bfa) drop-shadow(0 0 10px #8b5cf6)}
  .glow-cyan  {filter:drop-shadow(0 0 5px #67e8f9) drop-shadow(0 0 10px #22d3ee)}
  .glow-pink  {filter:drop-shadow(0 0 5px #f0abfc) drop-shadow(0 0 10px #e879f9)}
  .glow-azure {filter:drop-shadow(0 0 5px #93c5fd) drop-shadow(0 0 10px #60a5fa)}

  /* Mobile-Safe Scanline (No glitchy mix-blend-mode) */
  .scan{
    position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;
  }
  .scan::after{
    content:"";position:absolute;inset:-50% 0;
    background:linear-gradient(180deg,transparent,rgba(34,211,238,.08) 50%,transparent);
    animation:scanMove 4.5s linear infinite;
  }
  @keyframes scanMove{from{transform:translateY(-50%)}to{transform:translateY(50%)}}

  /* Status Badge */
  .status{
    position:absolute;bottom:24px;left:50%;transform:translateX(-50%);
    padding:6px 14px;border-radius:999px;
    background:rgba(10,4,32,.75);border:1px solid rgba(139,92,246,.4);
    box-shadow:0 0 20px rgba(139,92,246,.25);
    color:var(--ink);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
    display:flex;align-items:center;gap:8px;pointer-events:none;
  }
  .status .dot{
    width:7px;height:7px;border-radius:50%;background:#f0abfc;
    box-shadow:0 0 6px #f0abfc,0 0 12px #e879f9;animation:blink 1.4s ease-in-out infinite;
  }
  @keyframes blink{50%{opacity:.3}}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="stars"></div>

  <div class="stage" id="stage">
    <div class="caption">GenLayer <span>//</span> Consensus Engine</div>
    <div class="hud tl">SYS_NODE · 0x7A·F3</div>
    <div class="hud tr">STATUS · ACTIVE</div>
    <div class="hud bl">CONSENSUS · v1.0</div>
    <div class="hud br">ZK · SECURED</div>

    <div class="spinner-wrap" id="tilt">
      <svg class="core" viewBox="-100 -100 200 200" aria-hidden="true">
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/>
          </linearGradient>
          <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#e879f9"/><stop offset="1" stop-color="#60a5fa"/>
          </linearGradient>
          <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#e879f9"/>
          </linearGradient>
          <linearGradient id="hex" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#67e8f9"/>
          </linearGradient>
          <radialGradient id="coreGrad" cx=".5" cy=".5" r=".5">
            <stop offset="0" stop-color="#fff"/>
            <stop offset=".5" stop-color="#c4b5fd"/>
            <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="linkGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#8b5cf6" stop-opacity="0"/>
            <stop offset=".5" stop-color="#67e8f9" stop-opacity="1"/>
            <stop offset="1" stop-color="#e879f9" stop-opacity="0"/>
          </linearGradient>
        </defs>

        <!-- Orbital paths -->
        <circle class="ring r1" cx="0" cy="0" r="92"/>
        <circle class="ring r2" cx="0" cy="0" r="74"/>
        <circle class="ring r3" cx="0" cy="0" r="56"/>

        <!-- Core polygons -->
        <polygon class="core-hex" points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15"/>
        <polygon class="core-hex" points="0,-18 16,-9 16,9 0,18 -16,9 -16,-9" opacity=".6"/>

        <!-- Inner mesh container -->
        <g id="staticLinks" stroke="url(#linkGrad)" stroke-width=".5" opacity=".35" fill="none"></g>

        <!-- Center radial glow -->
        <circle cx="0" cy="0" r="22" fill="url(#coreGrad)"/>

        <!-- Real-time dynamic links container -->
        <g id="liveLinks" fill="none"></g>

        <!-- Dynamic orbital nodes root container -->
        <g id="orbitRoot"></g>

        <!-- Central pulsing core node -->
        <circle class="core-node" cx="0" cy="0" r="3.4"/>
        <circle class="core-node" cx="0" cy="0" r="1.6" style="animation-delay:.4s"/>
      </svg>
    </div>

    <div class="scan"></div>
    <div class="status"><span class="dot"></span> Consensus in progress</div>
  </div>

  <script>
  (() => {
    const stage = document.getElementById('stage');
    const tilt = document.getElementById('tilt');
    const staticLinks = document.getElementById('staticLinks');
    const liveLinks = document.getElementById('liveLinks');
    const orbitRoot = document.getElementById('orbitRoot');
    const SVG_NS = 'http://www.w3.org/2000/svg';

    if (!stage || !tilt || !staticLinks || !liveLinks || !orbitRoot) return;

    // Static geometric mesh
    (function buildStaticMesh() {
      const pts = [];
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2;
        pts.push([Math.cos(a) * 30, Math.sin(a) * 30]);
      }
      for (let i = 0; i < pts.length; i++) {
        for (let j = i + 1; j < pts.length; j++) {
          const [x1, y1] = pts[i], [x2, y2] = pts[j];
          if (Math.hypot(x1 - x2, y1 - y2) < 55) {
            const line = document.createElementNS(SVG_NS, 'line');
            line.setAttribute('x1', x1); line.setAttribute('y1', y1);
            line.setAttribute('x2', x2); line.setAttribute('y2', y2);
            staticLinks.appendChild(line);
          }
        }
      }
    })();

    // Rings setup
    const rings = [
      { r: 92, count: 3, speed: 0.45, dir: 1 },
      { r: 74, count: 4, speed: 0.70, dir: -1 },
      { r: 56, count: 5, speed: 0.95, dir: 1 }
    ];
    const glows = ['glow-violet', 'glow-cyan', 'glow-pink', 'glow-azure'];
    const nodes = [];

    // Create orbital nodes
    rings.forEach((ring, ri) => {
      for (let i = 0; i < ring.count; i++) {
        const c = document.createElementNS(SVG_NS, 'circle');
        c.setAttribute('r', ri === 0 ? '2.6' : ri === 1 ? '2.2' : '2.4');
        c.setAttribute('cx', '0');
        c.setAttribute('cy', String(-ring.r));
        c.setAttribute('class', `node ${glows[(i + ri) % glows.length]}`);
        orbitRoot.appendChild(c);
        nodes.push({
          el: c,
          r: ring.r,
          ang: (i / ring.count) * Math.PI * 2,
          dir: ring.dir * ring.speed,
          x: 0,
          y: 0
        });
      }
    });

    // Create links pool
    const linkPool = [];
    const totalLinks = nodes.length * 2;
    for (let i = 0; i < totalLinks; i++) {
      const ln = document.createElementNS(SVG_NS, 'line');
      ln.setAttribute('stroke', '#67e8f9');
      ln.setAttribute('stroke-width', '0.7');
      ln.setAttribute('stroke-linecap', 'round');
      liveLinks.appendChild(ln);
      linkPool.push(ln);
    }

    // 3D Tilt calculation (supports Mouse and Touch Drag)
    let tx = 0, ty = 0, cx = 0, cy = 0;
    const handleMove = (clientX, clientY) => {
      const rect = stage.getBoundingClientRect();
      tx = ((clientX - (rect.left + rect.width / 2)) / window.innerWidth) * 12;
      ty = -((clientY - (rect.top + rect.height / 2)) / window.innerHeight) * 12;
    };

    window.addEventListener('mousemove', (e) => handleMove(e.clientX, e.clientY));
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        handleMove(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    const resetTilt = () => { tx = 0; ty = 0; };
    window.addEventListener('mouseleave', resetTilt);
    window.addEventListener('touchend', resetTilt);

    // Render loop
    let last = performance.now();
    function tick(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;

      cx += (tx - cx) * 0.08;
      cy += (ty - cy) * 0.08;
      stage.style.transform = `rotateY(${cx}deg) rotateX(${cy}deg)`;
      tilt.style.transform = `translateZ(15px) rotateY(${cx * 0.4}deg) rotateX(${cy * 0.4}deg)`;

      for (const n of nodes) {
        n.ang += n.dir * dt;
        n.x = Math.cos(n.ang) * n.r;
        n.y = Math.sin(n.ang) * n.r;
        n.el.setAttribute('cx', n.x.toFixed(2));
        n.el.setAttribute('cy', n.y.toFixed(2));
      }

      let linkIdx = 0;
      for (let i = 0; i < nodes.length; i++) {
        const a = nodes[i];
        const dists = [];
        for (let j = 0; j < nodes.length; j++) {
          if (i === j) continue;
          const b = nodes[j];
          dists.push([j, Math.hypot(a.x - b.x, a.y - b.y)]);
        }
        dists.sort((p, q) => p[1] - q[1]);

        for (let k = 0; k < 2; k++) {
          const b = nodes[dists[k][0]];
          const d = dists[k][1];
          const ln = linkPool[linkIdx++];
          if (ln) {
            ln.setAttribute('x1', a.x.toFixed(2));
            ln.setAttribute('y1', a.y.toFixed(2));
            ln.setAttribute('x2', b.x.toFixed(2));
            ln.setAttribute('y2', b.y.toFixed(2));
            ln.setAttribute('stroke-opacity', (0.85 - Math.min(1, d / 120) * 0.55).toFixed(2));
          }
        }
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();
  </script>
</body>
</html>
